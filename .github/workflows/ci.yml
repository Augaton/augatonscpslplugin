name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Recuperer les assemblies du jeu
        run: ./tools/fetch-references.sh

      - name: Compiler
        run: dotnet build -c Release

      - name: Compiler chaque plugin seul
        run: |
          for project in plugins/*/*.csproj; do
            dotnet build "$project" -c Release -v q --nologo
          done

      - name: Tester
        run: dotnet test tests/AugatonLib.Tests -c Release --no-build

      - name: Preparer l'archive
        run: ./tools/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: zone-shilari-labapi
          path: out/zone-shilari-labapi.zip
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer gitleaks
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Chercher des secrets
        run: gitleaks git . --redact --no-banner --exit-code 1
