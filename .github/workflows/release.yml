name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Sans cache et sans droit d'ecriture : ce job execute du code et telecharge des dependances.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Recuperer les assemblies du jeu
        run: ./tools/fetch-references.sh

      - name: Compiler et tester
        run: ./tools/check.sh

      - name: Preparer l'archive
        run: ./tools/package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            out/zone-shilari-labapi.zip
            out/SHA256SUMS
          if-no-files-found: error

  # Seul job a pouvoir ecrire : il n'execute rien du depot, il publie ce que build a produit.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Publier
        run: |
          cat > notes.md <<'NOTES'
          ## Installation

          Extraire `zone-shilari-labapi.zip` dans le dossier `LabAPI` du serveur :

          ```
          plugins/global/*.dll
          dependencies/global/AugatonLib.dll
          dependencies/global/0Harmony.dll
          ```

          L'archive contient tous les plugins, HintServiceMeow et Harmony : il n'y a rien d'autre a installer.
          Pour ne garder qu'une partie des plugins, supprimer les autres de `plugins/global/`, sans toucher a
          `HintServiceMeow.dll`.

          `SHA256SUMS` donne l'empreinte de l'archive : `sha256sum -c SHA256SUMS`.
          NOTES
          gh release create "$TAG" release/zone-shilari-labapi.zip release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag --prerelease
